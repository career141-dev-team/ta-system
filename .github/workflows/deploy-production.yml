name: Deploy Production

# The `production` branch is what runs live — https://ta-system.career141.com
# on the live database (api.career141.com). A release is a fast-forward of
# production to a commit that is already on main:
#
#   git push origin main:production
#
# Three locks before anything is touched:
#   1. PRODUCTION_ENABLED (repository variable) must be "true". It is off until
#      the production target is provisioned and approved (docs/CI-CD.md).
#   2. The commit must already be on main.
#   3. The "production" GitHub Environment allows only the production branch.
#      It has no required reviewer: Sanjeev and Binath both release (4 Nov 2026).
#
# A database backup is taken first only when the release runs a function (a
# migration) or a manual run asks for one (backup: always). The owner takes a
# backup each morning, so ordinary releases skip the 15-minute dump.
# Production settings (where it lives on the server) are repository variables,
# so they can be set when the target exists without changing this file.

on:
  push:
    branches: [production]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      components:
        description: What to deploy
        type: choice
        options: [all, app, convex, new-ui, chip-search]
        default: all
      run_function:
        description: Convex function to run after deploying (optional, e.g. migrations/foo:run)
        type: string
        default: ""
      run_args:
        description: JSON arguments for that function
        type: string
        default: "{}"
      backup:
        description: Database backup first (auto = only when a function runs)
        type: choice
        options: [auto, always]
        default: auto

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-production
  cancel-in-progress: false

jobs:
  gate:
    name: Release checks
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      backup: ${{ steps.backup.outputs.need }}
      new_ui: ${{ steps.parts.outputs.new_ui }}
      chip_search: ${{ steps.parts.outputs.chip_search }}
      rest: ${{ steps.parts.outputs.rest }}
    steps:
      - name: Production enabled
        if: ${{ vars.PRODUCTION_ENABLED != 'true' }}
        run: |
          echo "::error::Production deploys are switched off (repository variable PRODUCTION_ENABLED is not 'true'). See docs/CI-CD.md."
          exit 1

      - name: Only from the production branch
        if: ${{ github.ref != 'refs/heads/production' }}
        run: |
          echo "::error::Run this workflow on the production branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The commit has been through main (and staging)
        id: check
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main. Merge to main first, let staging deploy it, then fast-forward production."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # One repo, two UIs (24 Nov 2026): a release deploys only the parts it
      # changes. apps/new-ui/** is the new UI (its own static site and routes);
      # everything else is the backend and the old app, deployed as before.
      # Unknown "before" (first push, manual run) = deploy what was asked, or all.
      - name: Which parts changed?
        id: parts
        env:
          BEFORE: ${{ github.event.before }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          new_ui=false; rest=false; chip_search=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$COMPONENTS" in
              new-ui) new_ui=true ;;
              chip-search) chip_search=true ;;
              all|"") new_ui=true; rest=true; chip_search=true ;;
              *) rest=true ;;
            esac
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            new_ui=true; rest=true; chip_search=true
          else
            changed=$(git diff --name-only "$BEFORE" HEAD)
            echo "$changed" | grep -q '^apps/new-ui/' && new_ui=true
            echo "$changed" | grep -Eq '^(services/chip-search/|convex/lib/search/|\.github/workflows/deploy-production\.yml$)' && chip_search=true
            echo "$changed" | grep -Ev '^(apps/new-ui/|services/chip-search/)' | grep -q . && rest=true
          fi
          echo "new_ui=$new_ui" >> "$GITHUB_OUTPUT"
          echo "chip_search=$chip_search" >> "$GITHUB_OUTPUT"
          echo "rest=$rest" >> "$GITHUB_OUTPUT"
          echo "This release deploys - new UI: $new_ui, chip-search: $chip_search, backend + old app: $rest"

      # A full dump of the 15 GB database takes about 15 minutes. The owner
      # takes a backup each morning, so a release takes one only when it runs
      # a one-off function (a migration, which rewrites stored rows) or a
      # manual run asks for it (`backup: always`). A schema change alone no
      # longer does: the schema only ever gains optional fields, which change
      # no stored row. (Owner's decision, 21 September — twice.)
      # A function run with "dryRun": true only reads, so it takes none either:
      # the dump was most of every dry run's 25 minutes (owner, 26 October).
      # `backup: always` still forces one.
      - name: Does this release need a database backup?
        id: backup
        env:
          FORCE: ${{ inputs.backup }}
          RUN_FUNCTION: ${{ inputs.run_function }}
          RUN_ARGS: ${{ inputs.run_args }}
        run: |
          need=false
          if [ "$FORCE" = "always" ]; then
            need=true
          elif [ -n "$RUN_FUNCTION" ] && ! printf '%s' "$RUN_ARGS" | grep -Eq '"dryRun"[[:space:]]*:[[:space:]]*true'; then
            need=true
          fi
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "Database backup before this release: $need"

  ci:
    name: CI
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      build: false
      ref: ${{ needs.gate.outputs.sha }}

  deploy:
    name: Production
    needs: [gate, ci]
    if: ${{ needs.gate.outputs.rest == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      ref: ${{ needs.gate.outputs.sha }}
      components: ${{ inputs.components || 'all' }}
      run_function: ${{ inputs.run_function || '' }}
      run_args: ${{ inputs.run_args || '{}' }}
      # Where production lives (21 Sep): the app in /opt/ta-prod, on the CV
      # platform's Convex backend (loopback 3210) and its Postgres. A repository
      # variable still overrides each, should the server layout change.
      deploy_dir: ${{ vars.PRODUCTION_DEPLOY_DIR || '/opt/ta-prod' }}
      env_file: ${{ vars.PRODUCTION_ENV_FILE || '.env.production' }}
      compose_source: ${{ vars.PRODUCTION_COMPOSE_SOURCE || 'deploy/production/docker-compose.yml' }}
      app_service: ${{ vars.PRODUCTION_APP_SERVICE || 'app' }}
      app_container: ${{ vars.PRODUCTION_APP_CONTAINER || 'ta-prod-app' }}
      health_url: ${{ vars.PRODUCTION_HEALTH_URL || 'http://127.0.0.1:3110/signin' }}
      convex_port: ${{ vars.PRODUCTION_CONVEX_PORT || '3210' }}
      backup_postgres_container: ${{ needs.gate.outputs.backup == 'true' && (vars.PRODUCTION_POSTGRES_CONTAINER || 'career141-postgres-1') || '' }}
      backup_postgres_db: ${{ vars.PRODUCTION_POSTGRES_DB || 'convex_self_hosted' }}
      backup_postgres_user: ${{ vars.PRODUCTION_POSTGRES_USER || 'convex' }}

  # The new UI (apps/new-ui) on new.career141.com, served from the same server by
  # Caddy (deploy/production/new-ui.Caddyfile). Its own static build, uploaded as
  # a release folder and switched live with one link (deploy/scripts/remote-new-ui.sh).
  # It runs after the backend when both changed, so a screen never goes live
  # before the backend it calls.
  new-ui:
    name: New UI
    needs: [gate, ci, deploy]
    if: ${{ always() && needs.gate.outputs.new_ui == 'true' && needs.gate.result == 'success' && needs.ci.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://new.career141.com
    defaults:
      run:
        working-directory: apps/new-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/new-ui/package-lock.json

      - run: npm ci

      # The live build reads the real backend; without these two public values
      # it silently builds the sample-data version (seen 19 Nov), so it is checked.
      - name: Build
        run: npm run build:static
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEW_UI_CONVEX_URL || 'https://ta-system-api.career141.com' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEW_UI_CLERK_PUBLISHABLE_KEY }}

      - name: The build talks to the live backend
        env:
          URL: ${{ vars.NEW_UI_CONVEX_URL || 'https://ta-system-api.career141.com' }}
        run: |
          test -f out/today.html
          grep -rqF "$URL" out/_next/static || { echo "::error::The new UI build has no backend address - it would be the sample version. Set NEW_UI_CLERK_PUBLISHABLE_KEY."; exit 1; }

      - name: Package
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          tar -czf "/tmp/new-ui-$SHA.tgz" -C out .
          npx --yes esbuild@0.25.12 server/api.ts --bundle --platform=node --target=node22 --format=esm --outfile="/tmp/new-ui-api-$SHA.mjs"

      - name: SSH access
        working-directory: .
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $HOST
            User ${{ secrets.VPS_USERNAME }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload and switch
        working-directory: .
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          scp -q "/tmp/new-ui-$SHA.tgz" "/tmp/new-ui-api-$SHA.mjs" deploy/scripts/remote-new-ui.sh deploy-target:/tmp/
          ssh deploy-target "bash /tmp/remote-new-ui.sh '$SHA'"

      # Asked on the server itself (Caddy, the real certificate, the live link):
      # since 24 Nov the address sits behind Cloudflare, whose bot check answers
      # GitHub's runners 403 although the site is up for people.
      - name: Live check
        working-directory: .
        run: |
          for i in 1 2 3 4 5; do
            code=$(ssh deploy-target "curl -s -o /dev/null -w '%{http_code}' --resolve new.career141.com:443:127.0.0.1 https://new.career141.com/today") && [ "$code" = 200 ] && { echo "new.career141.com/today 200"; exit 0; }
            sleep 5
          done
          echo "::error::new.career141.com/today did not answer 200 on the server (last: $code)"; exit 1

  # The chip-search service (services/chip-search + convex/lib/search) runs on the
  # VPS as the `chip-search` container reading /opt/chip-search/data/cards.jsonl.
  # Syncing its code tarball and running start.sh keeps POST /agent and OpenRouter
  # DeepSeek fallback in lockstep with production releases without touching cards.jsonl.
  chip-search:
    name: Chip Search
    needs: [gate, ci]
    if: ${{ always() && needs.gate.outputs.chip_search == 'true' && needs.gate.result == 'success' && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Package chip-search
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: tar -czf "/tmp/chip-search-$SHA.tgz" services/chip-search convex/lib/search

      - name: SSH access
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $HOST
            User ${{ secrets.VPS_USERNAME }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload and restart chip-search
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          scp -q "/tmp/chip-search-$SHA.tgz" deploy-target:/tmp/
          ssh deploy-target "mkdir -p /opt/chip-search/code && tar -xzf /tmp/chip-search-$SHA.tgz -C /opt/chip-search/code && rm -f /tmp/chip-search-$SHA.tgz && sh /opt/chip-search/code/services/chip-search/start.sh"

      # 28 Nov 2026: the query agent's names, email / phone flags and CV text file. Rewritten on each
      # release of this service (a read-only export, no AI); the nightly job keeps it fresh between.
      # The last run's log is printed first, so its outcome can be read here.
      - name: Names and CV text
        run: |
          ssh deploy-target "tail -n 8 /opt/chip-search/text.log 2>/dev/null || true"
          ssh deploy-target "(nohup sh /opt/chip-search/code/services/chip-search/nightly.sh text > /opt/chip-search/text.log 2>&1 < /dev/null &)"

      - name: Chip-search health check
        run: |
          for i in $(seq 1 15); do
            health=$(ssh deploy-target "docker exec chip-search wget -qO- http://127.0.0.1:3311/health 2>/dev/null || true")
            echo "health ($i): $health"
            echo "$health" | grep -q '"ok":true' && exit 0
            sleep 3
          done
          echo "::error::chip-search did not become healthy in time"; exit 1
